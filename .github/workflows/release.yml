name: Publish Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}
          persist-credentials: false

      - name: Check release version
        run: |
          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts)"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Release tag must be a stable version matching app/build.gradle.kts (expected v$version)."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: Test and build APK
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Set ANDROID_KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Set ANDROID_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD}"
          umask 077
          keystore="$(mktemp)"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"

          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="CarNat-Xiaomi-${RELEASE_TAG}.apk"
          "$tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$tools/apksigner" verify --verbose "$apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "CarNat-Xiaomi-${RELEASE_TAG}.apk" \
            --title "CarNat $RELEASE_TAG" --verify-tag --generate-notes
