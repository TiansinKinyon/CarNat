version: "1.0"
name: carnat-android-release
displayName: CarNat Android Release
stages:
  - name: Build and sign APK
    displayName: Build and sign APK
    strategy: naturally
    trigger: auto
    steps:
      - step: build@gradle
        name: build_android
        displayName: Build CarNat
        jdkVersion: "17"
        gradleVersion: "4.4"
        commands:
          - bash .workflow/build-gitee-release.sh
        artifacts:
          - name: CARNAT_APK
            path:
              - release-artifacts
            type: .tar.gz
  - name: Publish Gitee Release
    displayName: Publish Gitee Release
    strategy: naturally
    trigger: auto
    steps:
      - step: release@gitee
        name: publish_gitee
        displayName: Publish CarNat
        releaseName: "CarNat ${CARNAT_RELEASE_TAG}"
        description: "CarNat ${CARNAT_RELEASE_TAG} for Xiaomi. Download the signed APK\
      \ below."
        tagName: "${CARNAT_RELEASE_TAG}"
        upstreamArtifact:
          - CARNAT_APK
        assertFiles:
          - "release-artifacts/CarNat-Xiaomi-${CARNAT_RELEASE_TAG}.apk"
        prerelease: false
        allowUpdate: false
triggers:
  trigger: auto
  push:
    tags:
      prefix: []
      precise: []
      include:
        - "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
notify: []
ref_variable:
  - ANDROID_KEYSTORE_BASE64
  - ANDROID_KEYSTORE_PASSWORD
  - ANDROID_KEY_ALIAS
  - ANDROID_KEY_PASSWORD
